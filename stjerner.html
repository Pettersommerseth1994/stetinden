<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Stjerneforslag</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ac:#EF7140}
*{box-sizing:border-box}body{margin:0;background:#FEFDFA;color:#111;font-family:'Inter Tight',system-ui,sans-serif;padding:40px 32px 80px}
h1{font-weight:500;font-size:28px;margin:0 0 6px}p.s{margin:0 0 36px;opacity:.6}
h2{font-weight:500;font-size:15px;margin:48px 0 16px;opacity:.55;text-transform:uppercase;letter-spacing:.08em}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.c{background:#F7F6F1;border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:18px}
.c .big{height:120px;display:flex;align-items:center;justify-content:center;color:var(--ac)}
.c .big svg{height:110px;width:110px;overflow:visible}
.c .lk{display:flex;align-items:center;gap:.12em;font-size:20px;font-weight:500;background:#FEFDFA;border-radius:10px;padding:12px 14px}
.c .lk svg{height:1.1em;width:1.1em;color:var(--ac);overflow:visible}
.c .lk i{font-style:normal;font-weight:400;opacity:.55}
.c b{font-weight:500;font-size:14px}.c small{opacity:.55;display:block;margin-top:2px;font-size:12.5px}
</style></head><body>
<h1>Stjerneforslag</h1><p class="s">Nåværende stjerne er nr. 0. Alle vist stort og i logoen.</p>
<h2>Nåværende</h2><div class="g" id="g0"></div>
<h2>10 nye varianter</h2><div class="g" id="g1"></div>
<h2>Skygge, som Mercedes-stjernen</h2><div class="g" id="g2"></div>
<script>
var C=32;
function rot(d,a){return '<path d="'+d+'" transform="rotate('+a+' 32 32)"/>'}
function kite(top,bot,w,a,extra){var d='M32 '+top+' '+(32+w)+' 32 32 '+bot+' '+(32-w)+' 32Z';return rot(d,0)+rot(d,90)}
// 8-punkts omriss for en fire-armet stjerne med spiss L, midjebredde w
function star8(L,w){var t=(L-w*0+0);var p=[],tip=L,wd=w;
 // indre hjørne der kantene krysser (diagonalen)
 var d=(wd*(L))/(L+wd); // d = L*w/(L+w) for kite med halv-lengde L, bredde w ved senter
 return d}
function facets(L,w,cols,wob){ // L: halv-lengde, w: midjebredde
 var d=L*w/(L+w), out='';
 var tips=[[0,-L],[L,0],[0,L],[-L,0]];
 for(var i=0;i<4;i++){
  var a=i*90,tipx=0,tipy=-L,lx=-d,ly=-d,rx=d,ry=-d;
  var g='transform="translate(32 32) rotate('+a+')"';
  out+='<path '+g+' d="M0 '+tipy+' L'+lx+' '+ly+' L0 0Z" fill="'+cols[0]+'"/>';
  out+='<path '+g+' d="M0 '+tipy+' L'+rx+' '+ry+' L0 0Z" fill="'+cols[1]+'"/>';
 }
 return out}
function sparkle(L,k){return 'M32 '+(32-L)+' Q'+(32+k)+' '+(32-k)+' '+(32+L)+' 32 Q'+(32+k)+' '+(32+k)+' 32 '+(32+L)+' Q'+(32-k)+' '+(32+k)+' '+(32-L)+' 32 Q'+(32-k)+' '+(32-k)+' 32 '+(32-L)+'Z'}
var V0=[{n:'0 · Nåværende',t:'Fire spisser, smal midje',s:kite(4,60,5)}];
var small='M32 4 37 32 32 60 27 32Z';
var V1=[
 {n:'1 · Slankere',t:'Tynnere midje, mer elegant',s:kite(4,60,3)},
 {n:'2 · Kraftigere',t:'Bredere midje, mer tyngde',s:kite(4,60,8)},
 {n:'3 · Skarp gnist',t:'Konkave sider, som en glimt',s:'<path d="'+sparkle(28,3.2)+'"/>'},
 {n:'4 · Mykere gnist',t:'Konkave sider, rundere',s:'<path d="'+sparkle(28,6)+'"/>'},
 {n:'5 · Høy',t:'Lengre loddrett enn vannrett',s:'<path d="M32 0 37 32 32 64 27 32Z"/><path d="M32 8 36 32 32 56 28 32Z" transform="rotate(90 32 32)"/>'},
 {n:'6 · Åtte spisser',t:'Liten stjerne på diagonalen',s:kite(4,60,5)+'<g transform="rotate(45 32 32)">'+'<path d="M32 16 34.4 32 32 48 29.6 32Z"/><path d="M32 16 34.4 32 32 48 29.6 32Z" transform="rotate(90 32 32)"/></g>'},
 {n:'7 · Splittet',t:'Fire frittstående spisser',s:[0,90,180,270].map(function(a){return rot('M32 4 36 22 32 26 28 22Z',a)}).join('')},
 {n:'8 · Rundede spisser',t:'Myke hjørner',s:'<g stroke="currentColor" stroke-width="3" stroke-linejoin="round" fill="currentColor"><path d="M32 7 36 32 32 57 28 32Z"/><path d="M32 7 36 32 32 57 28 32Z" transform="rotate(90 32 32)"/></g>'},
 {n:'9 · Hull i midten',t:'Ring i sentrum',s:'<g fill-rule="evenodd"><path d="'+'M32 4 37 32 32 60 27 32Z'+'"/></g>'+rot('M32 4 37 32 32 60 27 32Z',90)+'<circle cx="32" cy="32" r="3.2" fill="#F7F6F1"/>'},
 {n:'10 · Med følgesvenn',t:'Hovedstjerne og liten gnist',s:'<g transform="translate(-4 4) scale(.82) translate(5.8 -5.8)">'+kite(4,60,5)+'</g><g transform="translate(46 14) scale(.2) translate(-32 -32)">'+kite(4,60,5)+'</g>'}
];
var V2=[
 {n:'11 · Skygge, to toner',t:'Hver arm delt: lys og mørk halvdel',s:facets(28,5,['#F4A27D','#D95A28'])},
 {n:'12 · Skygge, bred',t:'Samme, med bredere midje for tydeligere flater',s:facets(28,9,['#F7B292','#C9501F'])},
 {n:'13 · Skygge, hele stjernen',t:'Lys fra øvre venstre, mørk mot nedre høyre',s:(function(){var d=28*6/(28+6),o='';var cols=[['#F9BFA3','#EF7140'],['#EF7140','#C9501F'],['#D95A28','#A63F14'],['#EF7140','#C9501F']];for(var i=0;i<4;i++){o+='<path transform="translate(32 32) rotate('+i*90+')" d="M0 -28 L'+(-d)+' '+(-d)+' L0 0Z" fill="'+cols[i][0]+'"/><path transform="translate(32 32) rotate('+i*90+')" d="M0 -28 L'+d+' '+(-d)+' L0 0Z" fill="'+cols[i][1]+'"/>'}return o})()},
 {n:'14 · Skygge, svart-hvit',t:'Til bruk der oransje ikke passer',s:facets(28,6,['#8a8a86','#111'])}
];
function card(v){var big='<svg viewBox="0 0 64 64" fill="currentColor">'+v.s+'</svg>';
 var dark=v.s.indexOf('#111')>-1;
 return '<div class="c"><div class="big" '+(dark?'style="color:#111"':'')+'>'+big+'</div><div class="lk"><svg viewBox="0 0 64 64" fill="currentColor" '+(dark?'style="color:#111"':'')+'>'+v.s+'</svg><span>stetinden <i>studio</i></span></div><div><b>'+v.n+'</b><small>'+v.t+'</small></div></div>'}
[[V0,'g0'],[V1,'g1'],[V2,'g2']].forEach(function(x){document.getElementById(x[1]).innerHTML=x[0].map(card).join('')});
</script></body></html>
